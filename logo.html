<script>
/* Lettrage construit « BO'S HARVEST FARM » : cercles et traits de 1,8 unité, hauteur de capitale 10.
   Le O est la pousse dans son anneau, les A des tunnels de serre, l'apostrophe une graine. */
(function (root) {
  'use strict';
  var PI = Math.PI, DEG = PI / 180;
  var S = 1.8, R = 2.95, r = R - S;

  function arc(cx, cy, rad, a0, a1, n) {
    var pts = [], i;
    n = n || Math.max(6, Math.ceil(Math.abs(a1 - a0) / 6));
    for (i = 0; i <= n; i++) {
      var a = (a0 + (a1 - a0) * i / n) * DEG;
      pts.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]);
    }
    return pts;
  }
  function area(p) {
    var s = 0;
    for (var i = 0; i < p.length; i++) { var a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; }
    return s / 2;
  }
  function ccw(p) { return area(p) < 0 ? p.slice().reverse() : p; }
  function cwise(p) { return area(p) > 0 ? p.slice().reverse() : p; }
  function clean(p) {
    var out = [];
    p.forEach(function (q) {
      var l = out[out.length - 1];
      if (!l || Math.abs(l[0] - q[0]) > 1e-6 || Math.abs(l[1] - q[1]) > 1e-6) out.push(q);
    });
    var f = out[0], z = out[out.length - 1];
    if (out.length > 2 && Math.abs(f[0] - z[0]) < 1e-6 && Math.abs(f[1] - z[1]) < 1e-6) out.pop();
    return out;
  }
  function part(outer, holes, kind) {
    return { outer: ccw(clean(outer)), holes: (holes || []).map(function (h) { return cwise(clean(h)); }), kind: kind || 'ink' };
  }
  function rect(x0, y0, x1, y1) { return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]; }
  function leaf(ox, oy, angDeg, L, W, n) {
    var ang = angDeg * DEG, ax = Math.cos(ang), ay = Math.sin(ang), px = -ay, py = ax, s1 = [], s2 = [], i;
    n = n || 16;
    for (i = 0; i <= n; i++) {
      var t = i / n, w = W * Math.pow(Math.sin(PI * t), 0.85), cx = ox + ax * L * t, cy = oy + ay * L * t;
      s1.push([cx + px * w, cy + py * w]);
      if (i > 0 && i < n) s2.push([cx - px * w, cy - py * w]);
    }
    return s1.concat(s2.reverse());
  }
  function interRight(c1, c2, rad) {
    var dx = c2[0] - c1[0], dy = c2[1] - c1[1], d = Math.hypot(dx, dy), a = d / 2, h = Math.sqrt(rad * rad - a * a);
    var mx = (c1[0] + c2[0]) / 2, my = (c1[1] + c2[1]) / 2, px = -dy / d, py = dx / d;
    var p1 = [mx + px * h, my + py * h], p2 = [mx - px * h, my - py * h];
    return p1[0] > p2[0] ? p1 : p2;
  }
  function lineCircle(p0, dir, c, rad) {
    var fx = p0[0] - c[0], fy = p0[1] - c[1];
    var A = dir[0] * dir[0] + dir[1] * dir[1], B = 2 * (fx * dir[0] + fy * dir[1]), C = fx * fx + fy * fy - rad * rad;
    var t = (-B - Math.sqrt(B * B - 4 * A * C)) / (2 * A);
    return [p0[0] + dir[0] * t, p0[1] + dir[1] * t];
  }
  function moved(p, dx, dy) { return p.map(function (q) { return [q[0] + dx, q[1] + dy]; }); }

  function B() {

    s += iconSVG(7.2, 110, 112, { ink: C.ink, leaf: C.leaf });
    return s + '</svg>';
  }
  function variants() {
    var t = T(), out = [];
    var v1 = lockup({ k: 8, pad: 2, tagline: t.tagline, colors: { ink: C.ink, leaf: C.leaf, tag: '#5A625C' } });
    out.push([svgWrap(v1, 'Bo\'s Harvest Farm'), C.sand]);
    var v2 = lockup({ k: 8, pad: 2, stacked: true, tagline: t.tagline, colors: { ink: C.ink, leaf: C.leaf, tag: '#5A625C' } });
    out.push([svgWrap(v2, 'Bo\'s Harvest Farm'), C.paper]);
    var ic = '<svg viewBox="0 0 220 220" role="img" aria-label="Icône"><rect x="10" y="10" width="200" height="200" rx="46" fill="' + C.leaf + '"/>' + iconSVG(14, 110, 110, { ink: C.cream, leaf: '#FFFFFF' }) + '</svg>';
    out.push([ic, C.sand]);
    out.push([badge(), C.paper]);
    var v5 = lockup({ k: 8, pad: 2, tagline: t.tagline, colors: { ink: C.ink, leaf: C.ink, tag: C.ink } });
    out.push([svgWrap(v5, 'Bo\'s Harvest Farm'), C.paper]);
    var v6 = lockup({ k: 8, pad: 2, tagline: t.tagline, colors: { ink: C.cream, leaf: '#4BC487', tag: '#BFC6C2' } });
    out.push([svgWrap(v6, 'Bo\'s Harvest Farm'), C.ink]);
    return out;
  }

  /* ---------- en situation ---------- */
  function crate() {
    var t = T(), s = '<svg viewBox="0 0 440 280" role="img" aria-label="Caisse">';
    s += '<ellipse cx="220" cy="258" rx="190" ry="12" fill="#000" opacity=".12"/>';
    s += '<rect x="52" y="54" width="336" height="182" fill="#5E3F22"/>';
    [[48, 52], [48, 116], [48, 180]].forEach(function (pl) {
      s += '<rect x="' + pl[0] + '" y="' + pl[1] + '" width="344" height="58" rx="3" fill="#CFA36C" stroke="#A97C49" stroke-width="2"/>';
      for (var g = 0; g < 3; g++) s += '<path d="M' + (pl[0] + 20) + ' ' + (pl[1] + 14 + g * 15) + ' C ' + (pl[0] + 120) + ' ' + (pl[1] + 8 + g * 15) + ', ' + (pl[0] + 220) + ' ' + (pl[1] + 22 + g * 15) + ', ' + (pl[0] + 330) + ' ' + (pl[1] + 12 + g * 15) + '" fill="none" stroke="#A97C49" stroke-width="1" opacity=".35"/>';
    });
    s += '<rect x="36" y="44" width="26" height="200" rx="3" fill="#B98B55" stroke="#96693A" stroke-width="2"/><rect x="378" y="44" width="26" height="200" rx="3" fill="#B98B55" stroke="#96693A" stroke-width="2"/>';
    var st = '<g opacity=".86">' + badge().replace(/^<svg[^>]*>/, '').replace('</svg>', '')
      .replace(/fill="#E6D8B6"/g, 'fill="none"').replace(/#1F2B33/g, '#4A2E1A').replace(/#2E9A62/g, '#4A2E1A').replace(/bf-top/g, 'cr-top').replace(/bf-bot/g, 'cr-bot') + '</g>';
    s += '<g transform="translate(92 76) scale(.6)">' + st + '</g>';
    s += '<g font-family="JetBrains Mono, ui-monospace, monospace" fill="#4A2E1A" opacity=".82" text-anchor="middle">' +
      '<text x="300" y="146" font-size="17" font-weight="600" letter-spacing="3">' + t.stencil[0] + '</text>' +
      '<text x="300" y="174" font-size="14" letter-spacing="3">' + t.stencil[1] + '</text></g>';
    return s + '</svg>';
  }
  function bag() {
    var t = T(), s = '<svg viewBox="0 0 280 320" role="img" aria-label="Sac">';
    s += '<ellipse cx="140" cy="300" rx="104" ry="9" fill="#000" opacity=".12"/>';
    s += '<path d="M104 92 C 98 40, 182 40, 176 92" fill="none" stroke="#A9865B" stroke-width="6" stroke-linecap="round"/>';
    s += '<path d="M48 90 L232 90 L222 296 L58 296 Z" fill="#C9A57A"/><path d="M48 90 L232 90 L230 112 L50 112 Z" fill="#B8956A"/>';
    s += '<path d="M70 112 L66 296 M214 112 L218 296" stroke="#B08C5F" stroke-width="1.5" opacity=".6"/>';
    var v = lockup({ k: 3.9, pad: 1, stacked: true, tagline: t.tagline, colors: { ink: '#1F2B33', leaf: '#2E9A62', tag: '#3A4044' } });
    s += '<g transform="translate(' + (140 - v.W / 2).toFixed(1) + ' 138)">' + v.svg.replace(/bf-/g, 'bg-') + '</g>';
    return s + '</svg>';
  }

  /* ---------- 3D ---------- */
  var kind = 'icone', mat = 'vert';
  var v = new M3.Viewer($('#v3d'), {});
  function load3d() { v.load(BosLogo3D.build(kind, mat)); if (!reduce) v.setAuto(true); }
  v.on('auto', function (on) { $('#b-spin').setAttribute('aria-pressed', on ? 'true' : 'false'); });
  $('#b-spin').addEventListener('click', function () { v.setAuto(!v.isAuto()); });
  function chips(el, items, active, onPick) {
    el.innerHTML = '';
    Object.keys(items).forEach(function (k) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = items[k];
      if (active !== null) b.setAttribute('aria-pressed', k === active ? 'true' : 'false');
      b.addEventListener('click', function () {
        if (active !== null) {
          el.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
        }
        onPick(k);
      });
      el.appendChild(b);
    });
  }

  function render(play) {
    var t = T();
    document.documentElement.lang = lang;
    $('#t-eyebrow').textContent = t.eyebrow; $('#t-title').textContent = t.title; $('#t-lede').textContent = t.lede;
    $('#b-replay').textContent = t.replay; $('#b-grid').textContent = t.grid; $('#b-neg').textContent = t.neg;
    $('#b-svg').textContent = t.dlSvg; $('#b-png').textContent = t.dlPng; $('#t-hint').textContent = t.hint;
    document.title = 'Bo\'s Harvest Farm · ' + (lang === 'fr' ? 'le logo' : 'the logo');
    $('#v3d').setAttribute('aria-label', t.h3d);
    renderBoard(play);
    $('#t-idea-k').textContent = t.ideaK; $('#t-idea-h').textContent = t.ideaH; $('#t-idea-l').textContent = t.ideaL;
    var svgs = ideaSVGs();
    $('#ideas').innerHTML = t.ideas.map(function (it, i) { return '<div class="idea">' + svgs[i] + '<h3>' + it[0] + '</h3><p>' + it[1] + '</p></div>'; }).join('');
    $('#t-var-k').textContent = t.varK; $('#t-var-h').textContent = t.varH;
    var vs = variants();
    $('#variants').innerHTML = vs.map(function (vv, i) { return '<figure class="var"><div class="art" style="background:' + vv[1] + '">' + vv[0] + '</div><figcaption><b>' + t.variants[i][0] + '</b><span>' + t.variants[i][1] + '</span></figcaption></figure>'; }).join('');
    $('#t-col-k').textContent = t.colK; $('#t-col-h').textContent = t.colH;
    $('#swatches').innerHTML = t.colors.map(function (c) { return '<div class="sw"><i style="background:' + c[1] + '"></i><div><b>' + c[0] + '</b><code>' + c[1] + '</code><span>' + c[2] + '</span></div></div>'; }).join('');
    $('#t-typo-k').textContent = t.typoK; $('#t-typo-h').textContent = t.typoH;
    $('#t-typo1-h').textContent = t.typo1H; $('#t-typo1-p').textContent = t.typo1P; $('#t-typo2-h').textContent = t.typo2H; $('#t-typo2-p').textContent = t.typo2P;
    var sp = lockup({ k: 6, pad: 1 }); $('#specimen').setAttribute('viewBox', '0 0 ' + sp.W.toFixed(1) + ' ' + sp.H.toFixed(1)); $('#specimen').innerHTML = sp.svg;
    $('#t-3d-k').textContent = t.k3d; $('#t-3d-h').textContent = t.h3d; $('#t-3d-l').textContent = t.l3d;
    $('#l-kind').textContent = t.kind; $('#l-mat').textContent = t.mat; $('#l-view').textContent = t.view; $('#b-spin').textContent = t.spin;
    chips($('#kinds'), t.kinds, kind, function (k) { kind = k; load3d(); });
    chips($('#mats'), t.mats, mat, function (m) { mat = m; v.swapPolys(BosLogo3D.build(kind, mat)); });
    chips($('#views'), t.views, null, function (k) { v.view(k); });
    $('#t-mock-k').textContent = t.mockK; $('#t-mock-h').textContent = t.mockH;
    $('#crate').innerHTML = crate(); $('#bag').innerHTML = bag();
    $('#t-crate').textContent = t.crate; $('#t-bag').textContent = t.bag;
    $('#t-foot').textContent = t.foot; $('#t-home').textContent = t.home;
    $('#b-present').textContent = t.present; $('#b-share').textContent = t.share; $('#b-dl').textContent = t.dl;
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'); });
    if (deck) deck.refresh();
  }

  /* ---------- présentation section par section, partage, téléchargement ---------- */
  var deck = null;
  var SECTIONS = [['logo', ['.top', '#s-logo']], ['idee', ['#s-idee']], ['versions', ['#s-versions']], ['couleurs', ['#s-couleurs']],
    ['typo', ['#s-typo']], ['relief', ['#s-relief']], ['situation', ['#s-situation']]];
  deck = Present.deck({
    title: function () { return lang === 'fr' ? 'Bo\'s Harvest Farm · le logo' : 'Bo\'s Harvest Farm · the logo'; },
    labels: function () { return T().pz; },
    sections: SECTIONS.map(function (sc) {
      return { id: sc[0], els: sc[1].map(function (q) { return $(q); }), label: function () { return T().deck[sc[0]]; } };
    }),
    onShow: function (id) {
      if (id === 'logo' && !reduce) { board.classList.remove('play'); void board.offsetWidth; board.classList.add('play'); }
    }
  });
  $('#b-present').addEventListener('click', function () { deck.enter(true, 0); });
  $('#b-share').addEventListener('click', function () { Present.share(T().pz, deck.active() ? 'pres-' + deck.current() : ''); });
  if (Present.canDownload()) {
    $('#b-dl').hidden = false;
    $('#b-dl').addEventListener('click', function () { Present.download('logo.html', T().pz); });
  }
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.dataset.lang; try { localStorage.setItem('maquettes-lang', lang); } catch (e) { /* ignoré */ } render(false); });
  });
  /* lien « Toutes les maquettes » : retour en arrière si on vient de la page d'accueil */
  (function () {
    var a = document.getElementById('t-home');
    if (!a) return;
    a.addEventListener('click', function (e) {
      try {
        if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) { e.preventDefault(); history.back(); }
      } catch (err) { /* lien normal */ }
    });
  })();
  render(false);
  load3d();
  /* adresse avec ancre : #pres (présentation), #pres-couleurs (présentation sur une section), #couleurs (aller à la section) */
  var tokens = Present.hashTokens(), wantDeck = tokens.indexOf('pres') >= 0, at = -1;
  tokens.forEach(function (tk) { var i = deck.index(tk); if (i >= 0) at = i; });
  if (wantDeck) deck.enter(false, Math.max(0, at));
  else if (at > 0) { var tgt = SECTIONS[at][1][0]; setTimeout(function () { var n = $(tgt); if (n) n.scrollIntoView({ block: 'start' }); }, 60); }
  setTimeout(function () { if (!reduce) { board.classList.add('play'); } }, 350);
})();
</script>
</body>
</html>
