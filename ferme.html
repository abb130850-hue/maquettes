<script>
/* Lettrage construit « BO'S HARVEST FARM » : cercles et traits de 1,8 unité, hauteur de capitale 10.
   Le O est la pousse dans son anneau, les A des tunnels de serre, l'apostrophe une graine. */
(function (root) {
  'use strict';
  var PI = Math.PI, DEG = PI / 180;
  var S = 1.8, R = 2.95, r = R - S;

  function arc(cx, cy, rad, a0, a1, n) {
    var pts = [], i;
    n = n || Math.max(6, Math.ceil(Math.abs(a1 - a0) / 6));
    for (i = 0; i <= n; i++) {
      var a = (a0 + (a1 - a0) * i / n) * DEG;
      pts.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]);
    }
    return pts;
  }
  function area(p) {
    var s = 0;
    for (var i = 0; i < p.length; i++) { var a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; }
    return s / 2;
  }
  function ccw(p) { return area(p) < 0 ? p.slice().reverse() : p; }
  function cwise(p) { return area(p) > 0 ? p.slice().reverse() : p; }
  function clean(p) {
    var out = [];
    p.forEach(function (q) {
      var l = out[out.length - 1];
      if (!l || Math.abs(l[0] - q[0]) > 1e-6 || Math.abs(l[1] - q[1]) > 1e-6) out.push(q);
    });
    var f = out[0], z = out[out.length - 1];
    if (out.length > 2 && Math.abs(f[0] - z[0]) < 1e-6 && Math.abs(f[1] - z[1]) < 1e-6) out.pop();
    return out;
  }
  function part(outer, holes, kind) {
    return { outer: ccw(clean(outer)), holes: (holes || []).map(function (h) { return cwise(clean(h)); }), kind: kind || 'ink' };
  }
  function rect(x0, y0, x1, y1) { return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]; }
  function leaf(ox, oy, angDeg, L, W, n) {
    var ang = angDeg * DEG, ax = Math.cos(ang), ay = Math.sin(ang), px = -ay, py = ax, s1 = [], s2 = [], i;
    n = n || 16;
    for (i = 0; i <= n; i++) {
      var t = i / n, w = W * Math.pow(Math.sin(PI * t), 0.85), cx = ox + ax * L * t, cy = oy + ay * L * t;
      s1.push([cx + px * w, cy + py * w]);
      if (i > 0 && i < n) s2.push([cx - px * w, cy - py * w]);
    }
    return s1.concat(s2.reverse());
  }
  function interRight(c1, c2, rad) {
    var dx = c2[0] - c1[0], dy = c2[1] - c1[1], d = Math.hypot(dx, dy), a = d / 2, h = Math.sqrt(rad * rad - a * a);
    var mx = (c1[0] + c2[0]) / 2, my = (c1[1] + c2[1]) / 2, px = -dy / d, py = dx / d;
    var p1 = [mx + px * h, my + py * h], p2 = [mx - px * h, my - py * h];
    return p1[0] > p2[0] ? p1 : p2;
  }
  function lineCircle(p0, dir, c, rad) {
    var fx = p0[0] - c[0], fy = p0[1] - c[1];
    var A = dir[0] * dir[0] + dir[1] * dir[1], B = 2 * (fx * dir[0] + fy * dir[1]), C = fx * fx + fy * fy - rad * rad;
    var t = (-B - Math.sqrt(B * B - 4 * A * C)) / (2 * A);
    return [p0[0] + dir[0] * t, p0[1] + dir[1] * t];
  }
  function moved(p, dx, dy) { return p.map(function (q) { return [q[0] + dx, q[1] + dy]; }); }

  /* ---------- les lettres (origine en bas à gauche) ---------- */
  function B() {
    var xu = 2.4, xl = 3.0, cu = [xu, 10 - R], cl = [xl, R];
    var P = interRight(cl, cu, R);
    var aL = Math.atan2(P[1] - cl[1], P[0] - cl[0]) / DEG, aU = Math.atan2(P[1] - cu[1], P[0] - cu[0]) / DEG;
    var outer = [[0, 0], [xl, 0]].concat(arc(cl[0], cl[1], R, -90, aL).slice(1), arc(cu[0], cu[1], R, aU, 90).slice(1), [[0, 10]]);
    var hu = [[S, cu[1] - r], [xu, cu[1] - r]].concat(arc(cu[0], cu[1], r, -90, 90).slice(1), [[S, cu[1] + r]]);
    var hl = [[S, cl[1] - r], [xl, cl[1] - r]].concat(arc(cl[0], cl[1], r, -90, 90).slice(1), [[S, cl[1] + r]]);
    return { w: xl + R, parts: [part(outer, [hu, hl])] };
  }
  function Sg() {
    var ct = [R, 10 - R], cb = [R, R], t0 = 30, b0 = -150;
    var p = arc(ct[0], ct[1], R, t0, 270)
      .concat(arc(cb[0], cb[1], r, 90, b0).slice(1))
      .concat(arc(cb[0], cb[1], R, b0, 90))
      .concat(arc(ct[0], ct[1], r, 270, t0).slice(1));
    return { w: 2 * R, parts: [part(p)] };
  }
  function F() {
    return { w: 5.3, parts: [part([[0, 0], [S, 0], [S, 4.1], [4.3, 4.1], [4.3, 5.9], [S, 5.9], [S, 8.2], [5.3, 8.2], [5.3, 10], [0, 10]])] };
  }
  function A() {
    var Ar = 4.2, cy = 10 - Ar, w = 2 * Ar, cb = 3.2;
    var outer = [[0, 0], [0, cy]].concat(arc(Ar, cy, Ar, 180, 0).slice(1), [[w, 0], [w - S, 0], [w - S, cb], [S, cb], [S, 0]]);
    var hole = [[S, cb + S], [w - S, cb + S], [w - S, cy]].concat(arc(Ar, cy, Ar - S, 0, 180).slice(1));
    return { w: w, parts: [part(outer, [hole])] };
  }
  function Rg() {
    var xu = 2.4, cu = [xu, 10 - R], A0 = [6.6, 0], dir = [3.9 - 6.6, 4.3];
    var P = lineCircle(A0, dir, cu, R), aP = Math.atan2(P[1] - cu[1], P[0] - cu[0]) / DEG;
    var outer = [[0, 0], [S, 0], [S, cu[1] - R], [2.0, cu[1] - R], [4.5, 0], [6.6, 0], P].concat(arc(cu[0], cu[1], R, aP, 90).slice(1), [[0, 10]]);
    var hole = [[S, cu[1] - r], [xu, cu[1] - r]].concat(arc(cu[0], cu[1], r, -90, 90).slice(1), [[S, cu[1] + r]]);
    return { w: 6.6, parts: [part(outer, [hole])] };
  }
  function M() {
    return { w: 9.2, parts: [part([[0, 0], [0, 10], [2.3, 10], [4.6, 4.0], [6.9, 10], [9.2, 10], [9.2, 0], [7.4, 0], [7.4, 6.3], [5.45, 1.5], [3.75, 1.5], [1.8, 6.3], [1.8, 0]])] };
  }
  function H() {
    var w = 6.6;
    return { w: w, parts: [part([[0, 0], [S, 0], [S, 4.1], [w - S, 4.1], [w - S, 0], [w, 0], [w, 10], [w - S, 10], [w - S, 5.9], [S, 5.9], [S, 10], [0, 10]])] };
  }
  function E() {
    return { w: 5.3, parts: [part([[0, 0], [5.3, 0], [5.3, S], [S, S], [S, 4.1], [4.3, 4.1], [4.3, 5.9], [S, 5.9], [S, 8.2], [5.3, 8.2], [5.3, 10], [0, 10]])] };
  }
  function T() {
    var w = 6.4, a = (w - S) / 2, b = (w + S) / 2;
    return { w: w, parts: [part([[a, 0], [b, 0], [b, 8.2], [w, 8.2], [w, 10], [0, 10], [0, 8.2], [a, 8.2]])] };
  }
  function V() {
    /* deux jambages de 1,8 d'épaisseur qui se rejoignent sur un pied plat, comme le M */
    return { w: 7.8, parts: [part([[0, 10], [2.0, 10], [3.9, 3.45], [5.8, 10], [7.8, 10], [4.9, 0], [2.9, 0]])] };
  }
  var ICON = { Ro: 5.25, ri: 5.25 - S };
  /* le O : anneau + pousse, centré en (cx, cy) */
  function iconParts(cx, cy) {
    var parts = [];
    parts.push(part(arc(cx, cy, ICON.Ro, 0, 355, 71), [arc(cx, cy, ICON.ri, 0, 355, 71)], 'ink'));
    parts.push(part(rect(cx - 1.65, cy - 2.85, cx + 1.65, cy - 2.33), [], 'ink'));
    parts.push(part(rect(cx - 0.26, cy - 2.33, cx + 0.26, cy + 0.6), [], 'leaf'));
    parts.push(part(leaf(cx - 0.26, cy + 0.32, 133, 2.6, 0.92), [], 'leaf'));
    parts.push(part(leaf(cx + 0.26, cy - 0.38, 31, 2.9, 1.05), [], 'leaf'));
    return parts;
  }
  /* « BO'S HARVEST FARM » : sur une ligne, ou empilé en trois lignes (BO'S en grand, HARVEST et FARM dessous).
     Ordre des pièces (utilisé par la page logo) : B, l'anneau du O, la terre, la tige, deux feuilles, l'apostrophe, S,
     puis H A R V E S T, puis F A R M. */
  var GLYPH = { H: H, A: A, R: Rg, V: V, E: E, S: Sg, T: T, F: F, M: M };
  var KERN = { RV: -0.5 };   /* le R et le V sont ouverts : on les rapproche pour un espacement régulier à l'œil */
  var WORDS = { harvest: 'HARVEST', farm: 'FARM' };
  function sc(p, k, dx, dy) {
    var f = function (pts) { return pts.map(function (q) { return [q[0] * k + dx, q[1] * k + dy]; }); };
    return { outer: f(p.outer), holes: p.holes.map(f), kind: p.kind };
  }
  function wordW(str, gap) {
    var w = 0; str.split('').forEach(function (c, i) { w += GLYPH[c]().w + (i ? gap + (KERN[str[i - 1] + c] || 0) : 0); }); return w;
  }
  function wordmark(stacked) {
    var out = [], x = 0;
    function put(g, k, dx, dy) { g.parts.forEach(function (p) { out.push(sc(p, k, dx + x * k, dy)); }); x += g.w; }
    function word(str, gap, k, dx, dy) { str.split('').forEach(function (c, i) { if (i) x += gap + (KERN[str[i - 1] + c] || 0); put(GLYPH[c](), k, dx, dy); }); }
    put(B(), 1, 0, 0); x += 1.2;
    var cx = x + ICON.Ro; iconParts(cx, 5).forEach(function (p) { out.push(p); }); x = cx + ICON.Ro + 0.65;
    out.push(part(leaf(x + 0.25, 6.95, 80, 3.05, 0.88), [], 'leaf')); x += 1.55;
    put(Sg(), 1, 0, 0);
    var line1 = x;
    if (!stacked) {
      x += 3.3; word(WORDS.harvest, 1.1, 1, 0, 0);
      x += 3.3; word(WORDS.farm, 1.1, 1, 0, 0);

      poulailler: { k: 'Later', t: 'Chicken coop and laying hens', b: 'Planned for a second stage: a raised coop with nest boxes, a ramp and a fenced run for laying hens. Tap "Start-up" to see the farm without it.' },
      local: { k: 'Living area', t: 'Living quarters', b: 'For 2 to 3 people on site. Solar panels on the flat roof, gutters that collect rainwater. Turn on "House cutaway" to see the basement.' },
      soussol: { k: 'Below the house', t: 'Storage basement', b: 'The full footprint of the house, 2.9 m deep: crate shelves, pallets, a sorting table and ceiling lights. Nothing shows from outside.' },
      escalier: { k: 'Below the house', t: 'The stairs', b: 'A straight wooden flight of 10 steps starts from a hatch in the house floor (yellow outline) and goes down 2.9 m, with a handrail on the open side.' },
      congelateur: { k: 'Below the house', t: 'Freezers', b: 'At the back of the basement, near the stairs: a chest freezer (open here, with harvest crates) and an upright freezer. The harvest goes straight into the cold, out of sight.' },
      repos: { k: 'Living area', t: 'Rest area', b: 'A big palaver tree for shade, a hammock, a mat and everything for attaya tea. The spot to catch your breath between harvests.' },
      tortues: { k: 'Living area', t: 'Tortoises', b: 'A small pen with low walls, a shelter and a water dish for two African spurred tortoises, the Sahel species.' },
      eau: { k: 'Water', t: 'Water tank', b: 'A raised water reserve. It receives water from the rain basin and feeds the irrigation pipe (blue dashes) to the greenhouses.' },
      pluie: { k: 'Water', t: 'Rainwater', b: 'Channels along the greenhouses and gutters on the house collect the rain. It fills the basin and the green tank; a pump sends it up to the water tank.' },
      portail: { k: 'Entrance', t: 'Gate and sign', b: 'A single locked entrance under the Bo\'s Harvest Farm sign, lit at night. Wire fence backed by a thorny hedge.' },
      chiens: { k: 'Security', t: 'Two German Shepherds', b: 'By day they stay near the kennel and the gate. At night they patrol the fence line: turn on "Dogs on patrol" to watch them.' },
      lumiere: { k: 'Energy', t: 'Solar lighting', b: 'Solar street lights along the central path. Switch to Night to see them on.' },
      marches: { k: 'Markets', t: 'Off to market', b: 'The pickup carries the crates to the markets of Saint-Louis, Louga and Dakar.' }
    },
    foot: 'Indicative model with simplified proportions. First draft (simulation), not the final version.',
    home: 'All the models ›'
  }
};
/* ===================================================================== */

(function () {
  'use strict';
  var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var lang = (navigator.language || 'fr').slice(0, 2) === 'en' ? 'en' : 'fr';
  try { var saved = localStorage.getItem('maquettes-lang'); if (saved === 'en' || saved === 'fr') lang = saved; } catch (e) { /* stockage indisponible */ }
  var $ = function (s) { return document.querySelector(s); };
  var T = function () { return TEXTES[lang]; };
  var CUT = { soussol: 1, escalier: 1, congelateur: 1 };
  var autoCoupe = false, autoPhase = false;

  /* logo en tête de page */
  (function () {
    var wm = BosBrand.wordmark(false), bb = BosBrand.bbox(wm), k = 6, pad = 2;
    var svg = $('#logo'), w = (bb.w + pad * 2) * k, h = (bb.h + pad * 2) * k;
    svg.setAttribute('viewBox', '0 0 ' + w.toFixed(1) + ' ' + h.toFixed(1));
    svg.innerHTML = wm.parts.map(function (p) {
      return '<path class="' + (p.kind === 'leaf' ? 'leaf' : 'ink') + '" fill-rule="evenodd" d="' + BosBrand.pathOf(p, k, (pad - bb.x0) * k, (pad + bb.y1) * k) + '"/>';
    }).join('');
  })();

  var v = new M3.Viewer($('#v3d'), { title: function (id) { var p = T().pins[id]; return p ? p.t : null; } });
  var scene = BosFarm.build();
  v.load(scene);
  v.setMode('ver', 'p2');
  function pinOf(id) { return scene.pins.filter(function (p) { return p.id === id; })[0]; }

  function syncShow() {
    var b;
    if ((b = $('#b-coupe'))) b.setAttribute('aria-pressed', v.mode('coupe') ? 'true' : 'false');
    if ((b = $('#b-ronde'))) b.setAttribute('aria-pressed', scene.flags.ronde ? 'true' : 'false');
    if ((b = $('#b-vie'))) b.setAttribute('aria-pressed', scene.flags.vie ? 'true' : 'false');
    document.querySelectorAll('#phase .chip').forEach(function (c) { c.setAttribute('aria-pressed', c.dataset.k === v.mode('ver') ? 'true' : 'false'); });
    document.querySelectorAll('#tod .chip').forEach(function (c) { c.setAttribute('aria-pressed', c.dataset.k === v.mode('tod') ? 'true' : 'false'); });
  }
  function setCoupe(on, auto) { v.setMode('coupe', on); autoCoupe = on && !!auto; syncShow(); }
  function setPhase(ph, auto) { v.setMode('ver', ph); autoPhase = ph === 'p2' && !!auto; if (ph === 'p1' && v.selected() === 'poulailler') v.select(null); syncShow(); }
  function setTod(k) { v.setMode('tod', k); syncShow(); }
  function setAnim() {
    var f = scene.flags;
    v.setMode('anim', f.ronde || f.vie);
    if (!f.ronde || !f.vie) scene.animate(0);
    v.refresh(); syncShow();
  }
  /* avant de montrer un repère, on règle l'affichage qu'il demande */
  function prepare(id) {
    if (CUT[id]) { if (!v.mode('coupe')) setCoupe(true, true); }
    else if (autoCoupe && v.mode('coupe')) setCoupe(false);
    if (id === 'poulailler' && v.mode('ver') !== 'p2') setPhase('p2', true);
  }
  function go(id) { prepare(id); v.select(id, true); }
  function step(dir) {
    var o = scene.order, cur = v.selected(), i = o.indexOf(cur), n = i < 0 ? (dir > 0 ? 0 : o.length - 1) : (i + dir + o.length) % o.length;
    go(o[n]);
  }

  function card(id) {
    var t = T(), p = (id && t.pins[id]) || t.intro;
    var nav = id
      ? '<div class="row"><button class="chip" type="button" data-step="-1">' + t.prev + '</button><button class="chip" type="button" data-step="1">' + t.next + '</button><button class="chip" type="button" data-back="1">' + t.back + '</button></div>'
      : '<div class="row"><button class="chip tour" type="button" data-step="1">' + t.tour + ' ›</button></div>';
    $('#card').innerHTML = '<p class="k">' + p.k + '</p><h2>' + p.t + '</h2><p>' + p.b + '</p>' + nav;
    document.querySelectorAll('#list button').forEach(function (b) { b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'); });
  }
  $('#card').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.step) step(+b.dataset.step);
    if (b.dataset.back) { if (autoCoupe) setCoupe(false); v.select(null); v.view('ensemble'); }
  });
  v.on('select', function (id) {
    if (id && !CUT[id] && autoCoupe && v.mode('coupe')) setCoupe(false);
    card(id);
  });
  v.on('auto', function (on) { $('#b-spin').setAttribute('aria-pressed', on ? 'true' : 'false'); });

  function chips(el, items, onClick) {
    el.innerHTML = '';
    items.forEach(function (it) {
      var b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = it[1]; b.dataset.k = it[0];
      if (it[2]) b.id = it[2];
      if (it[3]) b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () { onClick(it[0], b); });
      el.appendChild(b);
    });
  }
  function renderList() {
    var t = T(), ls = $('#list'); ls.innerHTML = '';
    scene.order.forEach(function (id) {
      var pin = pinOf(id), li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.dataset.id = id;
      if (pin.ver === 'p2') li.className = 'p2';
      b.innerHTML = '<span class="num">' + pin.n + '</span><span>' + t.pins[id].t + '</span>';
      b.setAttribute('aria-current', v.selected() === id ? 'true' : 'false');
      b.addEventListener('click', function () {
        go(id);
        if (present && present.active()) return;
        var r = $('.vp').getBoundingClientRect();
        if (r.top < 0 || r.bottom > window.innerHeight) $('.vp').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      });
      li.appendChild(b); ls.appendChild(li);
    });
  }
  function render() {
    var t = T();
    document.documentElement.lang = lang;
    document.title = 'Bo\'s Harvest Farm · ' + (lang === 'fr' ? 'maquette 3D' : '3D model');
    $('#t-eyebrow').textContent = t.eyebrow; $('#t-lede').textContent = t.lede;
    $('#t-facts').innerHTML = t.facts.map(function (f) { return '<li>' + f + '</li>'; }).join('');
    $('#t-foot').textContent = t.foot; $('#t-home').textContent = t.home;
    $('#b-spin').textContent = t.spin; $('#b-explore').textContent = t.explore;
    $('#b-present').textContent = t.present; $('#b-share').textContent = t.share; $('#b-dl').textContent = t.dl;
    $('#t-hint').textContent = $('#b-explore').getAttribute('aria-pressed') === 'true' ? t.hintExplore : t.hint;
    $('#v3d').setAttribute('aria-label', 'Bo\'s Harvest Farm : ' + t.hint);
    $('#l-views').textContent = t.lViews; $('#l-tod').textContent = t.lTod; $('#l-show').textContent = t.lShow;
    chips($('#views'), Object.keys(t.views).map(function (k) { return [k, t.views[k]]; }), function (k) {
      v.select(null);
      if (k === 'soussol') { if (!v.mode('coupe')) setCoupe(true, true); }
      else if (autoCoupe) setCoupe(false);
      v.view(k);
    });
    chips($('#tod'), Object.keys(t.tods).map(function (k) { return [k, t.tods[k], null, true]; }), function (k) { setTod(k); });
    var show = $('#show'); show.innerHTML = '';
    var seg = document.createElement('div'); seg.className = 'seg'; seg.id = 'phase'; seg.setAttribute('role', 'group'); show.appendChild(seg);
    chips(seg, [['p1', t.phases.p1, null, true], ['p2', t.phases.p2, null, true]], function (k) { setPhase(k, false); });
    var rest = document.createElement('div'); rest.className = 'row'; show.appendChild(rest);
    chips(rest, [['coupe', t.coupe, 'b-coupe', true], ['ronde', t.ronde, 'b-ronde', true], ['vie', t.vie, 'b-vie', true]], function (k) {
      if (k === 'coupe') {
        var on = !v.mode('coupe'); setCoupe(on, false);
        if (on) { v.select(null); v.view('soussol'); }
      } else if (k === 'ronde') {
        scene.flags.ronde = !scene.flags.ronde;
        if (scene.flags.ronde && v.mode('tod') === 'jour') setTod('nuit');
        setAnim();
      } else {
        scene.flags.vie = !scene.flags.vie;
        if (scene.flags.vie && !v.selected()) v.view('elevage');
        setAnim();
      }
    });
    syncShow();
    renderList();
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'); });
    card(v.selected());
    if (present) present.refresh();
    v.refresh();
  }

  /* mode présentation, partage, téléchargement */
  var present = null;
  present = Present.attach({
    vp: $('.vp'), viewer: v,
    title: function () { return 'Bo\'s Harvest Farm'; },
    labels: function () { return T().pz; },
    panels: [$('.ctrls')], caption: $('#card'), strip: $('#list'),
    step: step
  });
  function shareHash() {
    var tk = [];
    if (present.active()) tk.push('pres');
    if (v.mode('tod') !== 'jour') tk.push(v.mode('tod'));
    if (v.selected()) tk.push(v.selected());
    return tk.join('-');
  }
  $('#b-present').addEventListener('click', function () { present.enter(true); });
  $('#b-share').addEventListener('click', function () { Present.share(T().pz, shareHash()); });
  if (Present.canDownload()) {
    $('#b-dl').hidden = false;
    $('#b-dl').addEventListener('click', function () { Present.download('ferme.html', T().pz); });
  }

  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.dataset.lang; try { localStorage.setItem('maquettes-lang', lang); } catch (e) { /* ignoré */ } render(); });
  });
  $('#b-spin').addEventListener('click', function () { v.setAuto(!v.isAuto()); });
  $('#b-in').addEventListener('click', function () { v.zoom(0.8); });
  $('#b-out').addEventListener('click', function () { v.zoom(1.25); });
  $('#b-explore').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', on ? 'true' : 'false'); v.setExplore(on);
    $('#t-hint').textContent = on ? T().hintExplore : T().hint;
  });
  /* lien « Toutes les maquettes » : retour en arrière si on vient de la page d'accueil */
  (function () {
    var a = document.getElementById('t-home');
    if (!a) return;
    a.addEventListener('click', function (e) {
      try {
        if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) { e.preventDefault(); history.back(); }
      } catch (err) { /* lien normal */ }
    });
  })();
  render();

  /* adresse avec ancre : #pres, #nuit, #chiens, #ronde… (séparés par des tirets) */
  var tokens = Present.hashTokens(), picked = null, wantPres = false;
  tokens.forEach(function (tk) {
    if (tk === 'pres') wantPres = true;
    else if (TEXTES.fr.tods[tk]) setTod(tk);
    else if (tk === 'coupe') setCoupe(true, false);
    else if (tk === 'ronde') { scene.flags.ronde = true; setAnim(); }
    else if (tk === 'vie') { scene.flags.vie = true; setAnim(); }
    else if (tk === 'p1' || tk === 'p2') setPhase(tk, false);
    else if (pinOf(tk)) picked = tk;
    else if (scene.views[tk]) { if (tk === 'soussol') setCoupe(true, true); v.view(tk, 0); }
  });
  if (picked) go(picked);
  if (wantPres) present.enter(false);
  if (!reduce && !picked && !tokens.length) setTimeout(function () { if (!v.selected()) v.setAuto(true); }, 900);
})();
</script>
</body>
</html>
