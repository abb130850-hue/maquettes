    $('#t-eyebrow').textContent = t.eyebrow; $('#t-title').textContent = t.title; $('#t-lede').textContent = t.lede; $('#t-foot').textContent = t.foot;
    ['ferme', 'logo', 'dossier', 'facade'].forEach(function (id) {
      var c = t.cards[id], el = $('#c-' + id);
      el.querySelector('.k').textContent = c.k; el.querySelector('h2 a').textContent = c.t;
      el.querySelector('.d').textContent = c.d; el.querySelector('.go').textContent = c.go;
      var ps = el.querySelector('.pres span'); if (ps) ps.textContent = t.pres;
    });
    $('#b-share').textContent = t.share; $('#b-zip').textContent = t.zip;
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'); });
  }
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.dataset.lang; try { localStorage.setItem('maquettes-lang', lang); } catch (e) { /* ignoré */ } render(); });
  });
  render();
  $('#b-share').addEventListener('click', function () { Present.share(TEXTES[lang].pz, ''); });
  if (Present.canDownload()) {
    $('#b-zip').hidden = false;
    $('#b-zip').addEventListener('click', function () {
      Present.downloadAll(['index.html', 'ferme.html', 'logo.html', 'dossier.html', 'facade.html'], 'Maquettes-Bos-Harvest-Farm-SVF.zip', TEXTES[lang].pz, 'maquettes',
        [{ name: 'LISEZ-MOI.txt', text: LISEZ_MOI }]);
    });
  }
})();
</script>
</body>
</html>
