    document.querySelectorAll('#tod .chip').forEach(function (c) { c.setAttribute('aria-pressed', c.dataset.k === v.mode('tod') ? 'true' : 'false'); });
  }
  /* animation : lettres de la façade, rue animée, ascenseurs (en coupe) */
  function syncAnim() {
    var on = !!(scene.flags.letters || scene.flags.walk || v.mode('coupe'));
    if (on !== v.mode('anim')) v.setMode('anim', on);
    if (!on) { scene.animate(0); v.refresh(); }
    else if (!scene.flags.letters) scene.animate(0.0001);
  }
  function setCoupe(on, auto) {
    if (on) {
      if (v.mode('ver') !== 'apres') setVer('apres');
      ['bat', 'main'].forEach(function (c) { if (v.exploded(c)) setExplode(false, false, c); });
    }
    v.setMode('coupe', on); autoCoupe = on && !!auto;
    if (!on) { var p = pinOf(v.selected()); if (p && p.cut === 'only') v.select(null); }
    syncAnim(); syncShow();
  }
  function setVer(ver, auto) {
    if (ver === 'avant' && v.mode('coupe')) setCoupe(false);
    v.setMode('ver', ver); autoVer = !!auto && ver === 'avant';
    var sel = v.selected(), p = sel && pinOf(sel);
    if (p && p.ver && p.ver !== ver) v.select(null);
    if (ver === 'avant' && scene.flags.letters) setAnim(false);
    syncShow();
  }
  /* deux vues éclatées indépendantes : « main » (la maquette d'essai) et « bat » (le bâtiment) */
  function setExplode(on, auto, ch) {
    ch = ch || 'main';
    if (on && v.mode('coupe')) setCoupe(false);
    v.setExplode(on, ch); autoEx[ch] = on && !!auto;
    if (!on) { var p = pinOf(v.selected()); if (p && chOf(p) === ch) v.select(null); }
    syncShow();
  }
  function dropAutoEx(keep) {
    Object.keys(autoEx).forEach(function (c) { if (autoEx[c] && c !== keep && v.exploded(c)) setExplode(false, false, c); });
  }
  function setTod(k) { v.setMode('tod', k); syncShow(); }
  function setAnim(on) {
    scene.flags.letters = on;
    syncAnim(); syncShow();
  }
  /* avant de montrer un repère, on règle l'affichage qu'il demande */
  function prepare(id) {
    var p = pinOf(id); if (!p) return;
    var ch = chOf(p);
    /* un repère d'une vue éclatée referme l'autre vue éclatée, pour que rien ne se superpose */
    if (ch) ['main', 'bat'].forEach(function (c) { if (c !== ch && v.exploded(c)) setExplode(false, false, c); });
    else dropAutoEx(null);
    /* la maquette d'essai est au pied de la tour : on referme le bâtiment éclaté pour la voir */
    if (id === 'maquette' && v.exploded('bat')) setExplode(false, false, 'bat');
    if (p.cut === 'only') { if (!v.mode('coupe')) setCoupe(true, true); }
    else if (autoCoupe && v.mode('coupe')) setCoupe(false);
    if (p.ver && v.mode('ver') !== p.ver) setVer(p.ver, true);
    else if (!p.ver && autoVer && id !== 'structure' && id !== 'grue') setVer('apres');
    if (ch && !v.exploded(ch)) setExplode(true, true, ch);
  }
  function go(id) { prepare(id); v.select(id, true); }
  function step(dir) {
    var o = scene.order, cur = v.selected(), i = o.indexOf(cur), n = i < 0 ? (dir > 0 ? 0 : o.length - 1) : (i + dir + o.length) % o.length;
    go(o[n]);
  }
  function overview() {
    dropAutoEx(null);
    if (autoCoupe) setCoupe(false);
    if (autoVer) setVer('apres');
    v.select(null); v.view('ensemble');
  }

  function card(id) {
    var t = T(), p = (id && t.pins[id]) || t.intro;
    var nav = id
      ? '<div class="row"><button class="chip" type="button" data-step="-1">' + t.prev + '</button><button class="chip" type="button" data-step="1">' + t.next + '</button><button class="chip" type="button" data-back="1">' + t.back + '</button></div>'
      : '<div class="row"><button class="chip tour" type="button" data-step="1">' + t.tour + ' ›</button></div>';
    $('#card').innerHTML = '<p class="k">' + p.k + '</p><h2>' + p.t + '</h2><p>' + p.b + '</p>' + (id ? '' : '<p class="sig">' + p.sig + '</p>') + nav;
    document.querySelectorAll('#list button').forEach(function (b) { b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'); });
  }
  $('#card').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.step) step(+b.dataset.step);
    if (b.dataset.back) overview();
  });
  v.on('select', function (id) {
    if (id) dropAutoEx(chOf(pinOf(id)));
    card(id);
  });
  v.on('auto', function (on) { $('#b-spin').setAttribute('aria-pressed', on ? 'true' : 'false'); });

  function chips(el, items, onClick) {
    el.innerHTML = '';
    items.forEach(function (it) {
      var b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = it[1]; b.dataset.k = it[0];
      if (it[2]) b.id = it[2];
      if (it[3]) b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () { onClick(it[0], b); });
      el.appendChild(b);
    });
  }
  function renderList() {
    var t = T(), ls = $('#list'); ls.innerHTML = '';
    scene.order.forEach(function (id) {
      var pin = pinOf(id), li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.dataset.id = id;
      if (pin.ex) li.className = pin.ex === 'bat' ? 'exb' : 'ex';
      b.innerHTML = '<span class="num">' + pin.n + '</span><span>' + t.pins[id].t + '</span>';
      b.setAttribute('aria-current', v.selected() === id ? 'true' : 'false');
      b.addEventListener('click', function () {
        go(id);
        if (present && present.active()) return;
        var r = $('.vp').getBoundingClientRect();
        if (r.top < 0 || r.bottom > window.innerHeight) $('.vp').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      });
      li.appendChild(b); ls.appendChild(li);
    });
  }
  function showBat(on, auto) {
    if (on && v.mode('ver') !== 'apres') setVer('apres');
    setExplode(on, auto, 'bat');
    if (on) { v.select(null); v.view('eclatebat'); }
    else if (!v.selected()) v.view('ensemble');
  }
  function render() {
    var t = T();
    document.documentElement.lang = lang;
    document.title = 'SVF · ' + (lang === 'fr' ? 'façade 3D' : '3D facade');
    $('#t-eyebrow').textContent = t.eyebrow;
    $('#t-title').innerHTML = t.title.replace('{SVF}', '<span class="svf">SVF</span>');
    $('#t-lede').textContent = t.lede;
    $('#t-facts').innerHTML = t.facts.map(function (f) { return '<li>' + f + '</li>'; }).join('');
    $('#t-foot').textContent = t.foot; $('#t-home').textContent = t.home; $('#t-pal').textContent = t.pal;
    $('#b-spin').textContent = t.spin; $('#b-explore').textContent = t.explore;
    $('#b-present').textContent = t.present; $('#b-share').textContent = t.share; $('#b-dl').textContent = t.dl;
    $('#b-plans').textContent = t.plansBtn; $('#pl-h').textContent = t.plans.h; $('#pl-p').textContent = t.plans.p;
    if (plans) plans.refresh();
    $('#t-hint').textContent = $('#b-explore').getAttribute('aria-pressed') === 'true' ? t.hintExplore : t.hint;
    $('#v3d').setAttribute('aria-label', 'SVF : ' + t.hint);
    $('#l-views').textContent = t.lViews; $('#l-tod').textContent = t.lTod; $('#l-show').textContent = t.lShow;
    chips($('#views'), Object.keys(t.views).map(function (k) { return [k, t.views[k]]; }), function (k) {
      if (k === 'eclatebat') { dropAutoEx('bat'); showBat(true, !v.exploded('bat') || autoEx.bat); return; }
      dropAutoEx(k === 'maquette' ? 'main' : null);
      if (k === 'maquette' && v.exploded('bat')) setExplode(false, false, 'bat');
      if (k === 'coupe') { if (!v.mode('coupe')) setCoupe(true, true); }
      else if (autoCoupe) setCoupe(false);
      v.select(null); v.view(k);
    });
    chips($('#tod'), Object.keys(t.tods).map(function (k) { return [k, t.tods[k], null, true]; }), function (k) { setTod(k); });
    var show = $('#show'); show.innerHTML = '';
    var seg = document.createElement('div'); seg.className = 'seg'; seg.setAttribute('role', 'group'); show.appendChild(seg);
    chips(seg, [['avant', t.avant, 'b-avant', true], ['apres', t.apres, 'b-apres', true]], function (k) {
      setVer(k, false);
      if (k === 'avant') { if (v.exploded('bat')) setExplode(false, false, 'bat'); v.select(null); v.view('ensemble'); }
    });
    var rest = document.createElement('div'); rest.className = 'row'; show.appendChild(rest);
    chips(rest, [['coupe', t.coupe, 'b-coupe', true], ['bat', t.bat, 'b-bat', true], ['eclate', t.eclate, 'b-eclate', true], ['anim', t.anim, 'b-anim', true], ['rue', t.rue, 'b-rue', true]], function (k) {
      if (k === 'coupe') { var oc = !v.mode('coupe'); setCoupe(oc, false); if (oc) { v.select(null); v.view('coupe'); } else if (!v.selected()) v.view('ensemble'); return; }
      if (k === 'rue') { scene.flags.walk = !scene.flags.walk; syncAnim(); syncShow(); if (scene.flags.walk && !v.selected()) v.view('angle'); return; }
      if (k === 'bat') { if (!v.exploded('bat') && v.exploded('main')) setExplode(false, false, 'main'); showBat(!v.exploded('bat'), false); }
      else if (k === 'eclate') {
        var on = !v.exploded('main'); setExplode(on, false, 'main');
        if (on) { if (v.exploded('bat')) setExplode(false, false, 'bat'); v.select(null); v.view('maquette'); }
      } else {
        var on2 = !scene.flags.letters;
        if (on2) {
          if (v.mode('ver') !== 'apres') setVer('apres');
          if (v.mode('tod') === 'jour') setTod('nuit');
          dropAutoEx(null);
          v.select(null); v.view(v.exploded('bat') ? 'eclatebat' : 'facade');
        }
        setAnim(on2);
      }
    });
    syncShow();
    renderList();
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'); });
    card(v.selected());
    if (present) present.refresh();
    v.refresh();
  }
  $('#palette').innerHTML = ['#63C2A6', '#3B95DB', '#2A4F9E', '#E0245A', '#E8273D', '#F26A21'].map(function (c) {
    return '<div><i style="background:' + c + '"></i><code>' + c + '</code></div>';
  }).join('');

  /* plans 2D d'architecte */
  plans = PlanKit.mount($('#pl'), { sheets: FacadePlans, lang: function () { return lang; }, labels: function () { return T().plans; } });
  $('#b-plans').addEventListener('click', function () { $('#plans').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); });
  /* mode présentation, partage, téléchargement */
  present = Present.attach({
    vp: $('.vp'), viewer: v,
    title: function () { return lang === 'fr' ? 'La façade SVF' : 'The SVF facade'; },
    labels: function () { return T().pz; },
    panels: [$('.ctrls')], caption: $('#card'), strip: $('#list'),
    step: step
  });
  function shareHash() {
    var tk = [];
    if (present.active()) tk.push('pres');
    if (v.mode('tod') !== 'jour') tk.push(v.mode('tod'));
    if (v.mode('ver') === 'avant') tk.push('avant');
    if (v.exploded('bat') && !autoEx.bat) tk.push('bat');
    if (v.exploded('main') && !autoEx.main) tk.push('eclate');
    if (scene.flags.letters) tk.push('anim');
    if (v.mode('coupe') && !autoCoupe) tk.push('coupe');
    if (scene.flags.walk) tk.push('rue');
    if (v.selected()) tk.push(v.selected());
    return tk.join('-');
  }
  $('#b-present').addEventListener('click', function () { present.enter(true); });
  $('#b-share').addEventListener('click', function () { Present.share(T().pz, shareHash()); });
  if (Present.canDownload()) {
    $('#b-dl').hidden = false;
    $('#b-dl').addEventListener('click', function () { Present.download('facade.html', T().pz); });
  }

  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.dataset.lang; try { localStorage.setItem('maquettes-lang', lang); } catch (e) { /* ignoré */ } render(); });
  });
  $('#b-spin').addEventListener('click', function () { v.setAuto(!v.isAuto()); });
  $('#b-in').addEventListener('click', function () { v.zoom(0.8); });
  $('#b-out').addEventListener('click', function () { v.zoom(1.25); });
  $('#b-explore').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', on ? 'true' : 'false'); v.setExplore(on);
    $('#t-hint').textContent = on ? T().hintExplore : T().hint;
  });
  /* lien « Toutes les maquettes » : retour en arrière si on vient de la page d'accueil */
  (function () {
    var a = document.getElementById('t-home');
    if (!a) return;
    a.addEventListener('click', function (e) {
      try {
        if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) { e.preventDefault(); history.back(); }
      } catch (err) { /* lien normal */ }
    });
  })();
  render();

  /* adresse avec ancre : #pres, #nuit, #bat, #eclate, #anim, #avant ou un repère (séparés par des tirets) */
  var tokens = Present.hashTokens(), picked = null, wantPres = false, wantAnim = false, view = null;
  tokens.forEach(function (tk) {
    if (tk === 'pres') wantPres = true;
    else if (TEXTES.fr.tods[tk]) setTod(tk);
    else if (tk === 'avant' || tk === 'apres') setVer(tk, false);
    else if (tk === 'bat') { setVer('apres'); setExplode(true, false, 'bat'); view = 'eclatebat'; }
    else if (tk === 'eclate') { setExplode(true, false, 'main'); view = view || 'maquette'; }
    else if (tk === 'anim') wantAnim = true;
    else if (tk === 'coupe') { setCoupe(true, false); view = view || 'coupe'; }
    else if (tk === 'rue') { scene.flags.walk = true; syncAnim(); syncShow(); }
    else if (tk === 'plans') setTimeout(function () { $('#plans').scrollIntoView({ block: 'start' }); }, 300);
    else if (pinOf(tk)) picked = tk;
    else if (scene.views[tk]) view = tk;
  });
  if (wantAnim) {
    if (v.mode('ver') !== 'apres') setVer('apres');
    if (v.mode('tod') === 'jour') setTod('nuit');
    setAnim(true); view = view || 'facade';
  }
  if (picked) go(picked);
  else if (view === 'eclatebat' && !v.exploded('bat')) showBat(true, true);
  else if (view) v.view(view, 0);
  if (wantPres) present.enter(false);
  if (!reduce && !picked && !tokens.length) setTimeout(function () { if (!v.selected()) v.setAuto(true); }, 900);
})();
</script>
</body>
</html>
