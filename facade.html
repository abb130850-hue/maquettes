<style>
/* =====================================================================

   (fr = français, en = anglais). La dédicace est dans « intro ».

:root {
  --paper: #EDF0F2; --sheet: #FFFFFF; --ink: #17212B; --ink-2: #55606A; --rule: #D3D9DE;
  --accent: #2A4F9E; --on-accent: #FFFFFF;
  --svf: linear-gradient(90deg, #63C2A6 0%, #3B95DB 22%, #2A4F9E 42%, #E0245A 64%, #E8273D 80%, #F26A21 100%);
  --stage-a: #DCE8EF; --stage-b: #F3F2ED; --stage-grid: rgba(23,33,43,.09);
  --pin: #17212B; --hl: #2B66CC; --tint: #F3F5F6;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --font-ui: "Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1217; --sheet: #151C23; --ink: #E5EAEE; --ink-2: #9AA6B0; --rule: #25303A;
    --accent: #7FA8FF; --on-accent: #0D1217;
    --stage-a: #1B2733; --stage-b: #0D1218; --stage-grid: rgba(229,234,238,.07);
    --pin: #E5EAEE; --hl: #74A2FF; --tint: #18212A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1217; --sheet: #151C23; --ink: #E5EAEE; --ink-2: #9AA6B0; --rule: #25303A;
  --accent: #7FA8FF; --on-accent: #0D1217;
  --stage-a: #1B2733; --stage-b: #0D1218; --stage-grid: rgba(229,234,238,.07);
  --pin: #E5EAEE; --hl: #74A2FF; --tint: #18212A; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16.5px; line-height: 1.55;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 16px; }
.top { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: end; justify-content: space-between; }
.head { display: grid; gap: 8px; max-width: 72ch; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0; }
h1 { margin: 0; font-family: var(--font-display); font-stretch: 118%; font-weight: 800; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1; text-wrap: balance; }
.svf { background: var(--svf); -webkit-background-clip: text; background-clip: text; color: transparent; }
.bar { height: 6px; border-radius: 3px; background: var(--svf); max-width: 360px; }
.lede { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
.lang { display: inline-flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--sheet); }
.lang button { border: 0; background: transparent; padding: 8px 14px; font-weight: 700; cursor: pointer; font-family: var(--font-mono); font-size: 13px; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 18px; font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); margin: 0; padding: 0; list-style: none; }
.vp { position: relative; aspect-ratio: 16 / 9; max-height: 680px; width: 100%; border-radius: 14px; border: 1px solid var(--rule); overflow: hidden; background: var(--stage-b); }
.vp canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.hint { position: absolute; left: 12px; bottom: 10px; margin: 0; font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); background: color-mix(in srgb, var(--sheet) 82%, transparent); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
.ibtn { min-width: 36px; height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); cursor: pointer; font-weight: 700; font-size: .85rem; }
.ibtn[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ctrls { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 12px; }
.grp { display: grid; gap: 6px; align-content: start; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); }
.grp-l { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--tint); cursor: pointer; font-size: .9rem; font-weight: 700; }
.chip.tour { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.act { min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--sheet); cursor: pointer; font-weight: 700; font-size: .9rem; }
.act.main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; }
.seg .chip { border: 0; border-radius: 0; }
.grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.card { padding: 18px 20px; border-radius: 12px; background: var(--sheet); border: 1px solid var(--rule); display: grid; gap: 8px; align-content: start; }
.card .k { margin: 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.card h2 { margin: 0; font-family: var(--font-display); font-stretch: 112%; font-size: 1.4rem; line-height: 1.15; }
.card p { margin: 0; }
.card .sig { font-family: var(--font-display); font-stretch: 110%; font-weight: 700; color: var(--accent); }
.list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.list button { width: 100%; text-align: left; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: center; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--rule); background: var(--sheet); cursor: pointer; font-size: .92rem; }
.list button[aria-current="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--pin); color: var(--sheet); font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
.list .ex .num { background: var(--accent); color: var(--on-accent); }
.pz-cap .sig { display: none; }
.list .exb .num { background: var(--svf); color: #FFFFFF; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.pal { display: grid; gap: 8px; }
.palette { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.palette div { border-radius: 10px; overflow: hidden; border: 1px solid var(--rule); background: var(--sheet); }
.palette i { display: block; height: 44px; }
.palette code { display: block; padding: 6px 8px; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); }
.foot a.home { color: inherit; font-weight: 700; white-space: nowrap; }
.foot { margin: 0; color: var(--ink-2); font-size: .9rem; border-top: 1px solid var(--rule); padding-top: 14px; }
@media (max-width: 900px) { .ctrls { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .vp { aspect-ratio: 1 / 1.12; }
  .list { grid-template-columns: minmax(0, 1fr); }
  .palette { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="head">
      <p class="eyebrow" id="t-eyebrow"></p>
      <h1 id="t-title"></h1>
      <div class="bar" aria-hidden="true"></div>
      <p class="lede" id="t-lede"></p>
    </div>
    <div class="acts">
      <button class="act main" id="b-present" type="button"></button>
      <button class="act" id="b-share" type="button"></button>
      <button class="act" id="b-dl" type="button" hidden></button>
      <div class="lang" role="group" aria-label="Langue / Language">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <ul class="facts" id="t-facts"></ul>

  <div class="vp">
    <canvas id="v3d" role="img"></canvas>
    <div class="tools">
      <button class="ibtn" id="b-spin" type="button" aria-pressed="false"></button>
      <button class="ibtn" id="b-out" type="button" aria-label="−" data-pz="wide">−</button>
      <button class="ibtn" id="b-in" type="button" aria-label="+" data-pz="wide">+</button>
      <button class="ibtn" id="b-explore" type="button" aria-pressed="false" data-pz="off"></button>
    </div>
    <p class="hint" id="t-hint"></p>
  </div>

  <div class="ctrls">
    <div class="grp"><p class="grp-l" id="l-views"></p><div class="row" id="views"></div></div>
    <div class="grp"><p class="grp-l" id="l-tod"></p><div class="row" id="tod"></div></div>
    <div class="grp"><p class="grp-l" id="l-show"></p><div class="row" id="show"></div></div>
  </div>

  <div class="grid">
    <article class="card" id="card" aria-live="polite"></article>
    <ul class="list" id="list"></ul>
  </div>

  <div class="pal">
    <p class="grp-l" id="t-pal"></p>
    <div class="palette" id="palette"></div>
  </div>

  <p class="foot"><span id="t-foot"></span> <a class="home" id="t-home" href="./"></a></p>
</div>

<script>
/* Moteur 3D v2, canvas 2D, sans dépendance.
   Ajouts : moments de la journée, niveaux de détail, vue en coupe avec sous-sol,
   objets animés, points (fruits, lampes), halos lumineux, boussole et échelle. */
(function (root) {
  'use strict';
  var PI = Math.PI;

  /* ---------- maths ---------- */
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function nrm(a) { var l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
  function hex(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) h = h.replace(/(.)/g, '$1$1');
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mix(a, b, t) {
    a = Array.isArray(a) ? a : hex(a); b = Array.isArray(b) ? b : hex(b);
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function grad(stops, t) {
    t = Math.max(0, Math.min(1, t));
    var n = stops.length - 1, i = Math.min(n - 1, Math.floor(t * n)), u = t * n - i;
    return mix(stops[i], stops[i + 1], u);
  }
  function newell(pts) {
    var x = 0, y = 0, z = 0;
    for (var i = 0; i < pts.length; i++) {
      var a = pts[i], b = pts[(i + 1) % pts.length];
      x += (a[1] - b[1]) * (a[2] + b[2]); y += (a[2] - b[2]) * (a[0] + b[0]); z += (a[0] - b[0]) * (a[1] + b[1]);
    }
    return nrm([x, y, z]);
  }
  function cen(pts) {
    var x = 0, y = 0, z = 0;
    for (var i = 0; i < pts.length; i++) { x += pts[i][0]; y += pts[i][1]; z += pts[i][2]; }
    return [x / pts.length, y / pts.length, z / pts.length];
  }
  function rng(seed) {
    var s = seed % 2147483647; if (s <= 0) s += 2147483646;
    return function () { s = s * 16807 % 2147483647; return (s - 1) / 2147483646; };
  }
  function ease(u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }
  function wrapAngle(a) { while (a > PI) a -= 2 * PI; while (a < -PI) a += 2 * PI; return a; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rotY(q, c, s) { return [q[0] * c + q[2] * s, q[1], -q[0] * s + q[2] * c]; }

  /* ---------- primitives ---------- */
  function P(pts, col, o) {
    var p = {
      pts: pts, rgb: Array.isArray(col) ? col : hex(col), a: 1, layer: 1, two: false, line: false,
      edge: 0, obj: null, grp: null, ver: null, shadow: true, flat: false, bias: 0, zi: 0,
      lw: 1, lwm: 0, dash: null, tc: null, tcs: null, parent: null,
      dot: 0, lod: null, cut: null, under: false, emit: null, glow: 0, tf: null, seam: false, holes: null,
      ec: null, edgem: 0, sonly: false
    };
    if (o) for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) p[k] = o[k];
    if (p.emit && !Array.isArray(p.emit)) p.emit = hex(p.emit);
    if (p.ec && !Array.isArray(p.ec)) p.ec = hex(p.ec);
    p.c = cen(pts);
    if (!p.line && !p.dot) p.n = newell(pts);
    return p;
  }
  function out(p, c) {
    if (dot(p.n, sub(p.c, c)) < 0) { p.pts.reverse(); p.n = [-p.n[0], -p.n[1], -p.n[2]]; }
    return p;
  }
  function copyPts(a) { return a.map(function (q) { return [q[0], q[1], q[2]]; }); }
  function rect(x0, z0, x1, z1) { return [[x0, z0], [x1, z0], [x1, z1], [x0, z1]]; }

  function B() { this.list = []; this.pins = []; this.zi = 0; this.def = null; }
  B.prototype.with = function (o) { this.def = o; return this; };
  B.prototype.opt = function (o) {
    if (!this.def) return o || {};
    var r = {}, k; for (k in this.def) r[k] = this.def[k];
    if (o) for (k in o) r[k] = o[k];
    return r;
  };
  B.prototype.add = function (p) { this.list.push(p); return p; };
  B.prototype.ground = function (xz, col, o, y) {
    y = y || 0;
    var p = P(xz.map(function (q) { return [q[0], y, q[1]]; }), col, Object.assign({ layer: 0, flat: true, shadow: false, zi: this.zi++ }, this.opt(o)));
    if (p.n[1] < 0) { p.pts.reverse(); p.n = [-p.n[0], -p.n[1], -p.n[2]]; }
    return this.add(p);
  };
  B.prototype.gline = function (a, b, col, o) {
    return this.add(P([[a[0], 0.03, a[1]], [b[0], 0.03, b[1]]], col, Object.assign({ layer: 0, line: true, shadow: false, zi: this.zi++ }, this.opt(o))));
  };
  B.prototype.line = function (a, b, col, o) { return this.add(P([a, b], col, Object.assign({ line: true, shadow: false }, this.opt(o)))); };
  B.prototype.dotAt = function (q, rad, col, o) { return this.add(P([q], col, Object.assign({ dot: rad, shadow: false }, this.opt(o)))); };
  B.prototype.quad = function (pts, col, o) { return this.add(P(pts, col, this.opt(o))); };
  B.prototype.box = function (x0, y0, z0, x1, y1, z1, col, o, top, bottom) {
    var v = [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]];
    var F = [[0, 1, 2, 3], [5, 4, 7, 6], [4, 0, 3, 7], [1, 5, 6, 2], [3, 2, 6, 7]];
    if (bottom) F.push([4, 5, 1, 0]);
    var c = [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], res = [], oo = this.opt(o);
    for (var i = 0; i < F.length; i++) {
      var pts = F[i].map(function (k) { return v[k].slice(); });
      res.push(this.add(out(P(pts, (i === 4 && top) ? top : col, oo), c)));
    }
    return res;
  };
  B.prototype.solid = function (faces, col, o, c) {
    var self = this, oo = this.opt(o);
    return faces.map(function (pts) { return self.add(out(P(copyPts(pts), col, oo), c)); });
  };
  B.prototype.decal = function (parent, pts, col, o) {
    var p = P(pts, col, Object.assign({ parent: parent, obj: parent.obj, grp: parent.grp, ver: parent.ver, cut: parent.cut, tf: parent.tf, shadow: false }, this.opt(o)));
    p.n = parent.n.slice();
    return this.add(p);
  };
  B.prototype.cyl = function (cx, cz, rad, y0, y1, n, col, o, topCol, rTop) {
    var c = [cx, (y0 + y1) / 2, cz], a0 = [], a1 = [], i, res = [], oo = this.opt(o), rt = rTop == null ? rad : rTop;
    for (i = 0; i < n; i++) {
      var a = i / n * PI * 2;
      a0.push([cx + Math.cos(a) * rad, y0, cz + Math.sin(a) * rad]);
      a1.push([cx + Math.cos(a) * rt, y1, cz + Math.sin(a) * rt]);
    }
    for (i = 0; i < n; i++) {
      var j = (i + 1) % n;
      res.push(this.add(out(P([a0[i].slice(), a0[j].slice(), a1[j].slice(), a1[i].slice()], col, oo), c)));
    }
    res.push(this.add(out(P(copyPts(a1), topCol || col, oo), c)));
    return res;
  };
  /* cylindre couché, axe z (roues) */
  B.prototype.wheel = function (cx, cy, z0, z1, rad, n, col, o) {
    var c = [cx, cy, (z0 + z1) / 2], f = [], b = [], i, oo = this.opt(o);
    for (i = 0; i < n; i++) { var a = i / n * PI * 2; f.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, z1]); b.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, z0]); }
    this.add(out(P(copyPts(f), col, oo), c)); this.add(out(P(copyPts(b), col, oo), c));
    for (i = 0; i < n; i++) { var j = (i + 1) % n; this.add(out(P([b[i].slice(), b[j].slice(), f[j].slice(), f[i].slice()], col, oo), c)); }
  };
  /* forme 2D (contour + trous) extrudée ; map(x, y, z) place les coordonnées dans la scène */
  B.prototype.shape = function (outer, holes, z0, z1, colF, colS, o, map) {
    var oo = this.opt(o), self = this;
    map = map || function (x, y, z) { return [x, y, z]; };
    function L(pts, z) { return pts.map(function (q) { return map(q[0], q[1], z); }); }
    var f = P(L(outer, z1), colF, oo);
    if (holes && holes.length) f.holes = holes.map(function (h) { return L(h, z1); });
    self.add(f);
    var bk = P(L(outer, z0).reverse(), colF, oo);
    if (holes && holes.length) bk.holes = holes.map(function (h) { return L(h, z0).reverse(); });
    self.add(bk);
    [outer].concat(holes || []).forEach(function (ring) {
      for (var i = 0; i < ring.length; i++) {
        var a = ring[i], b = ring[(i + 1) % ring.length];
        self.add(P([map(a[0], a[1], z0), map(b[0], b[1], z0), map(b[0], b[1], z1), map(a[0], a[1], z1)], colS, oo));
      }
    });
  };
  B.prototype.bipyr = function (x, z, y0, y1, ym, rad, n, col, o, rot) {
    var ring = [], i, top = [x, y1, z], bot = [x, y0, z];
    rot = rot || 0;

    else if (tk === 'avant' || tk === 'apres') setVer(tk, false);
    else if (tk === 'bat') { setVer('apres'); setExplode(true, false, 'bat'); view = 'eclatebat'; }
    else if (tk === 'eclate') { setExplode(true, false, 'main'); view = view || 'maquette'; }
    else if (tk === 'anim') wantAnim = true;
    else if (pinOf(tk)) picked = tk;
    else if (scene.views[tk]) view = tk;
  });
  if (wantAnim) {
    if (v.mode('ver') !== 'apres') setVer('apres');
    if (v.mode('tod') === 'jour') setTod('nuit');
    setAnim(true); view = view || 'facade';
  }
  if (picked) go(picked);
  else if (view === 'eclatebat' && !v.exploded('bat')) showBat(true, true);
  else if (view) v.view(view, 0);
  if (wantPres) present.enter(false);
  if (!reduce && !picked && !tokens.length) setTimeout(function () { if (!v.selected()) v.setAuto(true); }, 900);
})();
</script>
</body>
</html>
